name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Test Go gateway and voice package
        run: go test ./... && go test -race ./...
      - name: Test browser code
        run: node --check web/app.js && node --check web/worklet.js && node --test app_test.cjs
      - name: Compile macOS speech helper
        run: swiftc tools/tts.swift -o "$RUNNER_TEMP/tmux-mac-voice-tts"
